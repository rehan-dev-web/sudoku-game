<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Peringkat - Sudoku Pro</title>
<style>
  :root {
    --ios-blue: #007aff; --ios-bg: #f2f2f7; --ios-card: #ffffff;
    --ios-text: #000000; --ios-secondary: #8e8e93; --border-color: #d1d1d6;
  }
  body.dark { --ios-bg: #000; --ios-card: #1c1c1e; --ios-text: #fff; --border-color: #38383a; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
  body { background-color: var(--ios-bg); color: var(--ios-text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; transition: 0.3s; }
  h1 { margin: 20px 0; font-size: 24px; }
  .lb-container { width: 100%; max-width: 400px; background: var(--ios-card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .tabs { display: flex; justify-content: space-around; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; gap: 5px; }
  .tab { padding: 10px; cursor: pointer; font-size: 13px; color: var(--ios-secondary); font-weight: 600; }
  .tab.active { color: var(--ios-blue); border-bottom: 2px solid var(--ios-blue); }
  .list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
  .rank { font-weight: 700; margin-right: 10px; }
  .btn-back { margin-top: 30px; padding: 12px 24px; background: var(--ios-blue); color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>

  <h1>Papan Peringkat</h1>

  <div class="lb-container">
    <div class="tabs">
      <div class="tab active" data-diff="easy">Mudah</div>
      <div class="tab" data-diff="hard">Sulit</div>
      <div class="tab" data-diff="extreme">Ekstrim</div>
      <div class="tab" data-diff="god">Dewa</div>
      <div class="tab" data-diff="global">Top Level</div>
    </div>
    <div id="lbList">Memuat data...</div>
  </div>

  <a href="/" class="btn-back">Kembali ke Menu</a>

<script type="module">
  // IMPORT SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, query, orderByChild, limitToFirst, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  
  // CONFIG BARU LU
  const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Auto Dark Mode
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

  // LOGIC LOAD DATA
  async function loadData(diff) {
    const list = document.getElementById('lbList');
    list.innerHTML = 'Sedang memuat...';
    
    try {
      let q;
      // KASUS 1: Global Rank (Level Tertinggi)
      if (diff === 'global') {
        // Ambil dari 'users', urutkan berdasarkan 'level', ambil 20 terbawah (terbesar)
        q = query(ref(db, 'users'), orderByChild('level'), limitToLast(20));
      } 
      // KASUS 2: Leaderboard Game (Waktu Tercepat)
      else {
        // Ambil dari 'scores/diff', urutkan 'duration', ambil 20 teratas (terkecil)
        q = query(ref(db, `scores/${diff}`), orderByChild('duration'), limitToFirst(20));
      }

      const snapshot = await get(q);
      
      list.innerHTML = ''; // Kosongin loading
      
      if (snapshot.exists()) {
        let rawData = [];
        
        // Convert snapshot ke Array
        snapshot.forEach(child => {
          rawData.push(child.val());
        });

        // REVERSE LOGIC:
        // Kalo Global Rank, Firebase ngasih urutan Level 1 -> Level 99.
        // Kita mau Level 99 di atas, jadi Array-nya dibalik (Reverse).
        // Kalo Skor Waktu, Firebase ngasih 10 detik -> 60 detik. Itu udah bener, gausah dibalik.
        if (diff === 'global') {
          rawData.reverse();
        }

        // RENDER KE HTML
        rawData.forEach((d, i) => {
          let colorStyle = "";
          // Juara 1, 2, 3 dikasih warna beda
          if (i === 0) colorStyle = "color:#ff3b30; font-weight:800;"; // Merah
          else if (i === 1) colorStyle = "color:#007aff; font-weight:800;"; // Biru
          else if (i === 2) colorStyle = "color:#ffcc00; font-weight:800;"; // Kuning Emas
          
          // Format Info (Level atau Detik)
          const info = diff === 'global' ? `Lv. ${d.level || 1}` : `${d.duration} detik`;
          // Jaga-jaga kalo nickname kosong
          const name = d.nickname || "Player";

          list.innerHTML += `<div class="list-item" style="${colorStyle}">
            <span><span class="rank">#${i+1}</span> ${name}</span>
            <span>${info}</span>
          </div>`;
        });
      } else {
        list.innerHTML = 'Belum ada data skor.';
      }
    } catch (err) {
      console.error(err);
      list.innerHTML = 'Gagal memuat. Cek koneksi internet.';
    }
  }

  // EVENT LISTENER TAB
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      // Hapus class active dari semua tab
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      // Tambah class active ke yg diklik
      t.classList.add('active');
      // Load data sesuai kategori
      loadData(t.dataset.diff);
    };
  });

  // Load default pas pertama buka
  loadData('easy');
</script>
</body>
</html>
